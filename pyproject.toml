[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "matrixark-context-runtime"
version = "0.2.0"
description = "Python tooling for MatrixArk context ingestion, retrieval, and feedback, with the MCP and HTTP control-plane tools"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "MatrixArkAI contributors" }]
dependencies = []
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
]

# ONE DISTRIBUTION, TWO PACKAGES. `matrixark` is the context runtime this repository started as;
# `tools` is the MCP and HTTP control-plane tooling that arrived with the Python consolidation. They
# shipped as two root manifests in two repositories -- `matrixark-context-runtime` here and
# `matrixark-mcp` alongside the Rust engine -- and two root manifests cannot coexist in one
# repository. Merged rather than one overwriting the other: the entry points below came from the
# second manifest and are the only way those tools were ever launched.
[tool.setuptools]
packages = ["matrixark", "tools"]

[project.scripts]
matrixark-mcp-server = "tools.matrixark_mcp_server:main"
matrixark-http-portal = "tools.matrixark_admin:http_portal_main"
matrixark-agent-hook = "tools.matrixark_agent_hook:main"
matrixark-admin = "tools.matrixark_admin:main"
matrixark-local-recovery = "tools.matrixark_mcp_recovery:main"

[project.optional-dependencies]
models = [
  "sentence-transformers>=3.0.0",
  "transformers>=4.40.0",
  "pypdf>=4.0.0",
  "markdown-it-py>=3.0.0",
  "pillow>=10.0.0",
]
api = [
  "fastapi>=0.111.0",
  "uvicorn>=0.30.0",
]
test = [
  "pytest>=8.0.0",
]
